uvmf:
  interfaces:
    adder_in:
      clock: sig_clock
      reset: reset
      reset_assertion_level: 'False'
      ports:
      - name: sig_en_i
        width: '1'
        dir: output
        reset_value: 1'b0
      - name: sig_ina
        width: '1'
        dir: output
        reset_value: 1'b0
      - name: sig_inb
        width: '1'
        dir: output
        reset_value: 1'b0
      transaction_vars:
      - name: ina
        type: bit [1:0]
        isrand: 'True'
        iscompare: 'True'
      - name: inb
        type: bit [1:0]
        isrand: 'True'
        iscompare: 'True'
      config_vars:
      - name: checks_enable
        type: bit
        value: '1'
      - name: coverage_enable
        type: bit
        value: '1'

uvmf:
  benches:
    simpleadder:
      top_env: simpleadder
      clock_half_period: 5ns
      clock_phase_offset: 0ns
      reset_duration: 100ns
      reset_assertion_level: 'False'
      active_passive:
      - bfm_name: adder_in_agent
        value: ACTIVE
      - bfm_name: adder_out_agent
        value: PASSIVE

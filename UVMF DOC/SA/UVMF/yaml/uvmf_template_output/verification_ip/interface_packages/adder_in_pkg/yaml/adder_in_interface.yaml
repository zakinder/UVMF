uvmf:
  interfaces:
    adder_in:
      clock: sig_clock
      config_constraints: []
      config_vars:
      - comment: ''
        isrand: 'False'
        name: checks_enable
        type: bit
        value: '1'
      - comment: ''
        isrand: 'False'
        name: coverage_enable
        type: bit
        value: '1'
      existing_library_component: 'True'
      gen_inbound_streaming_driver: 'False'
      hdl_pkg_parameters: []
      hdl_typedefs: []
      hvl_pkg_parameters: []
      hvl_typedefs: []
      parameters: []
      ports:
      - dir: output
        name: sig_en_i
        reset_value: 1'b0
        width: '1'
      - dir: output
        name: sig_ina
        reset_value: 1'b0
        width: '1'
      - dir: output
        name: sig_inb
        reset_value: 1'b0
        width: '1'
      reset: reset
      reset_assertion_level: 'False'
      transaction_constraints: []
      transaction_vars:
      - comment: ''
        iscompare: 'True'
        isrand: 'True'
        name: ina
        type: bit [1:0]
        unpacked_dimension: ''
      - comment: ''
        iscompare: 'True'
        isrand: 'True'
        name: inb
        type: bit [1:0]
        unpacked_dimension: ''
      use_dpi_link: 'False'

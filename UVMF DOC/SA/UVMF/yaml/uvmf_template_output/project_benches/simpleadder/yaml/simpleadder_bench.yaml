uvmf:
  benches:
    simpleadder:
      active_passive:
      - bfm_name: adder_in_agent
        value: ACTIVE
      - bfm_name: adder_out_agent
        value: PASSIVE
      active_passive_default: ACTIVE
      clock_half_period: 5ns
      clock_phase_offset: 0ns
      existing_library_component: 'True'
      interface_params: []
      reset_assertion_level: 'False'
      reset_duration: 100ns
      top_env: simpleadder
      use_dpi_link: 'False'
